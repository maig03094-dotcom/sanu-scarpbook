<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Sanu 💕</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap');

:root{
  --rose:#c9798b;
  --deep:#8e5264;
  --blush:#f8dfe5;
  --pink:#f4cbd6;
  --cream:#fff9f7;
  --paper:#fffdfb;
  --brown:#76504b;
  --dark:#543d3b;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  color:var(--dark);
  font-family:"DM Sans",sans-serif;
  background:
    radial-gradient(circle at 8% 12%, rgba(255,255,255,.95) 0 5px, transparent 6px),
    radial-gradient(circle at 92% 18%, rgba(255,255,255,.8) 0 4px, transparent 5px),
    radial-gradient(circle at 20% 86%, rgba(255,255,255,.75) 0 4px, transparent 5px),
    linear-gradient(135deg,#fff8f8 0%,#fde9ee 42%,#f8dce5 100%);
}
body:before,body:after{
  content:"✿";
  position:fixed;
  color:rgba(201,121,139,.20);
  font-size:100px;
  pointer-events:none;
  z-index:0;
}
body:before{left:-22px;top:35px;transform:rotate(-18deg)}
body:after{right:-20px;bottom:15px;transform:rotate(18deg)}

.screen{
  min-height:100vh;
  display:none;
  align-items:center;
  justify-content:center;
  padding:32px 18px;
  position:relative;
  overflow:hidden;
}
.screen.active{display:flex}
.screen:before{
  content:"♡  ✧  ♡  ✧  ♡";
  position:absolute;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  color:rgba(142,82,100,.42);
  letter-spacing:12px;
  font-size:14px;
  z-index:1;
}
.card{
  width:min(92vw,760px);
  position:relative;
  z-index:2;
  background:rgba(255,253,251,.91);
  border:2px solid rgba(201,121,139,.22);
  border-radius:34px;
  box-shadow:0 25px 80px rgba(142,82,100,.17), inset 0 0 0 8px rgba(248,223,229,.28);
  padding:38px 34px;
  text-align:center;
  backdrop-filter:blur(10px);
}
.card:before{
  content:"🎀";
  position:absolute;
  top:-22px;
  left:50%;
  transform:translateX(-50%);
  font-size:34px;
  filter:drop-shadow(0 4px 5px rgba(100,50,60,.15));
}
.card:after{
  content:"♡";
  position:absolute;
  right:22px;
  top:18px;
  color:#df9bab;
  font-size:25px;
}
h1,h2{
  font-family:"Cormorant Garamond",serif;
  color:var(--deep);
  margin:0 0 14px;
  letter-spacing:.2px;
}
h1{font-size:clamp(48px,11vw,84px);line-height:.92}
h2{font-size:clamp(40px,8vw,62px)}
p{font-size:16px;line-height:1.85}
.message{
  font-family:"Cormorant Garamond",serif;
  font-size:25px;
  line-height:1.55;
  color:#604345;
}
button{
  border:0;
  background:linear-gradient(135deg,#c9798b,#a95d72);
  color:#fff;
  padding:14px 25px;
  border-radius:999px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 10px 24px rgba(169,93,114,.25);
  transition:.2s;
}
button:hover{transform:translateY(-3px) scale(1.01)}
.small{font-size:13px;opacity:.72}
input{
  width:min(100%,330px);
  padding:15px 18px;
  border-radius:18px;
  border:2px solid #efc8d2;
  background:#fffafa;
  color:#634247;
  font-size:17px;
  text-align:center;
  outline:none;
}
input:focus{border-color:#c9798b;box-shadow:0 0 0 4px rgba(201,121,139,.10)}
.error{color:#a64e63;min-height:24px;margin:12px 0;font-weight:600}
.stickers{
  display:flex;
  justify-content:center;
  gap:20px;
  align-items:flex-end;
  margin:18px 0 7px
}
.sticker{
  font-size:52px;
  filter:drop-shadow(0 5px 3px rgba(100,50,60,.12))
}
.tulips{font-size:31px;letter-spacing:5px;margin:10px;color:#c9798b}
#musicBar{position:fixed;top:14px;right:14px;z-index:20;display:none}
#musicBar button{padding:10px 16px;font-size:13px}

.polaroids{
  position:relative;
  width:100%;
  height:560px;
  margin:18px auto 8px
}
.photo{
  position:absolute;
  width:170px;
  background:#fff;
  padding:9px 9px 30px;
  box-shadow:0 16px 30px rgba(112,66,73,.19);
  border:1px solid #f0d4da;
  border-radius:5px;
}
.photo img{
  width:100%;
  height:190px;
  object-fit:cover;
  display:block;
  border-radius:2px
}
.bow{
  font-size:26px;
  position:absolute;
  top:-19px;
  left:50%;
  transform:translateX(-50%);
  z-index:2;
}
.p1{left:4%;top:35px;transform:rotate(-8deg)}
.p2{left:30%;top:0;transform:rotate(5deg)}
.p3{right:4%;top:55px;transform:rotate(8deg)}
.p4{left:10%;top:285px;transform:rotate(6deg)}
.p5{right:12%;top:300px;transform:rotate(-6deg)}
.p6{left:41%;top:245px;transform:rotate(2deg)}
.p7{left:38%;top:390px;transform:rotate(-7deg)}
.center-line{
  position:absolute;
  left:50%;
  top:195px;
  transform:translateX(-50%);
  font-family:"Cormorant Garamond",serif;
  font-size:35px;
  font-weight:700;
  width:290px;
  color:var(--deep);
  z-index:5;
  text-shadow:0 2px #fff;
}
@media(max-width:600px){
 .card{padding:30px 18px;border-radius:28px}
 .polaroids{height:680px}
 .photo{width:135px}.photo img{height:150px}
 .p1{left:0}.p2{left:31%}.p3{right:0}
 .p4{left:2%;top:300px}.p5{right:2%;top:330px}
 .p6{left:31%;top:260px}.p7{left:31%;top:480px}
 .center-line{top:190px;font-size:29px}
 .message{font-size:23px}
}
</style>
</head>
